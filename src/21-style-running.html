<style>
#dot{display:none}
#stat{display:flex;align-items:center;gap:18px;flex:none;color:#16171a;margin-right:8px}
body.running #stat{color:#f4f4f2}
.sg{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;letter-spacing:.01em}
#netG{cursor:pointer}
.bars{display:flex;align-items:flex-end;gap:3px;height:24px}
.bars i{width:5px;border-radius:1px;background:currentColor;opacity:.22;transition:opacity .08s}
.bars i:nth-child(1){height:28%}.bars i:nth-child(2){height:46%}.bars i:nth-child(3){height:64%}.bars i:nth-child(4){height:82%}.bars i:nth-child(5){height:100%}
.bars i.on{opacity:1}
#micBars.voice i.on{background:#2f9e5b}
#netBars.low i.on{background:#e0a030}
#netBars.off i{background:#d92d20;opacity:.55}
#dot.warn~#stat #netG .sl{color:#e0a030}
@media (max-width:640px){.sl{display:none}#stat{gap:11px;margin-right:4px}}
#logo{height:58px;width:auto;flex:none;background:#101014;border-radius:12px;padding:5px 9px;display:block}
@media (max-height:520px){#logo{height:30px;padding:3px 5px}}
#go:not(.stop){font-size:22px;padding:15px 34px 15px 28px;border-radius:999px;background:#16a34a;color:#fff;display:inline-flex;align-items:center;gap:12px;margin-left:auto;order:9;border:0;cursor:pointer;transition:background .15s}
#go:not(.stop)::before{content:'';flex:none;border-left:15px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
#go:not(.stop):hover{background:#15803d}
#go:not(.stop):active{transform:scale(.98)}
#go.stop{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:12px 26px}
#go.stop::before{content:'';flex:none;width:13px;height:13px;border-radius:2px;background:#fff}
body.running{background:#101014}
body.running #title,body.running #status,body.running #lag{color:#8d8d92}
body.running .icon{background:#1c1c22;color:#f4f4f2;border-color:#33333a}
body.running #go.stop{background:#d92d20;border:1px solid #d92d20}
body.running #rst{color:#8d8d92;border-color:#33333a}
body.running #en{justify-content:flex-start;position:relative;padding-bottom:1.5em;text-align:center;gap:.5em;line-height:1.35;font-weight:600;letter-spacing:0;padding-right:0}
body.running #en.over{justify-content:flex-end;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 1.6em);mask-image:linear-gradient(to bottom,transparent 0,#000 1.6em)}
body.running #en p,body.running #en p.cur,body.running #en p.prev,body.running #en p.next,body.running #en .interim,body.running #en p.interim.cur{font-size:1em;line-height:1.35;font-weight:600;font-style:normal;letter-spacing:0;opacity:1;margin:0;display:block;max-height:none}
body.running #en p.out{opacity:0;max-height:0}
body.running #en p.in{opacity:0}
body.running #en p.prev,body.running #en p.pending{color:#77777d}
body.running #en p.prev.p1{color:#f4f4f2}
body.running #en p.cur{color:#f2c94c;background:#1d1d24;border-radius:18px;padding:.45em .8em;margin-top:auto!important}
body.running #en #hist{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;gap:.4em;overflow:hidden;padding:0 .4em .6em;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 45%);mask-image:linear-gradient(to bottom,transparent 0,#000 45%)}
body.running #en #hist p{font-size:.6em;line-height:1.3;font-weight:600;color:#8d8d93;margin:0;opacity:1;max-height:none;transition:opacity .5s ease,transform .5s ease}
body.running #en #hist p.in{opacity:0;transform:translateY(1.2em)}body.running #en #hist p.out{opacity:0}
body.running #en #cbox{position:relative;flex:none;height:33vh;background:#f2c94c;color:#121214;border-radius:20px;overflow:hidden;margin:0 0 .15em}
body.running #en #cbox .bx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:.25em .7em;font-size:1.05em;line-height:1.25;font-weight:700;overflow:hidden;transition:opacity .45s ease,transform .45s ease}
body.running #en #cbox .bx.in{opacity:0;transform:translateY(18%)}body.running #en #cbox .bx.out{opacity:0;transform:translateY(-45%)}
body.running #en #hist p.hw{position:relative;flex:none;font-size:1em;transition:opacity .5s ease,transform 1s cubic-bezier(.45,0,.2,1)}
body.running #en #hist p.hw.in{transform:none}
body.running #en #hist .hi{position:absolute;left:50%;top:0;display:block;text-align:center;line-height:1.25;font-weight:700;color:#8d8d93;transform-origin:50% 0}
body.running #en #cbox .bx.out.roll{opacity:1;transform:none}
body.running #en #cbox .bx.rollin{transition:transform 1s cubic-bezier(.45,0,.2,1)}
body.running #en #cbox .bx.rollin.in{opacity:1;transform:translateY(105%)}
body.running #en #cmeas{position:absolute;left:-200vw;top:0;visibility:hidden;pointer-events:none;box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;padding:.25em .7em;font-size:1.05em;line-height:1.25;font-weight:700;overflow:hidden}
body.running #en #cbox .bx{box-sizing:border-box}
body.running #en #cbox .ref{color:#5a4a12}body.running #en #cbox .dots i{background:#121214}
body.running #en:has(#cbox){justify-content:flex-end;padding-bottom:0;gap:0}
body.running #en .dotrow{position:absolute;left:0;right:0;bottom:.15em;text-align:center;color:#77777d;font-size:.6em;line-height:1}
body.running #en p{transition:opacity .5s ease,transform .5s ease,max-height .45s ease}
body.running #en .interim,body.running #en p.interim.cur{color:#f2c94c}
body.running #en p .draft{opacity:1}
</style>
